name: Build rclone Android AAR

on:
  workflow_dispatch:   # adds a manual "Run workflow" button on the Actions tab

jobs:
  build-aar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gobind@latest
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Init gomobile
        run: gomobile init
        # ubuntu-latest ships ANDROID_HOME and one or more ANDROID_NDK_HOME
        # variants pre-set. If this step fails complaining it can't find the
        # NDK, run `env | grep ANDROID` in a debug step to see the exact var
        # names on the current runner image and export ANDROID_NDK_HOME
        # explicitly before this step.

      - name: Build AAR from this checkout
        run: |
          gomobile bind -androidapi 21 -v -target=android \
            -javapkg=org.rclone \
            -o rclone.aar \
            ./librclone/gomobile
        # Note the relative path (./librclone/gomobile) rather than the full
        # github.com/rclone/rclone/... module path -- this builds whatever
        # is actually checked out in your fork, not upstream's published
        # module. Matters once you start modifying rclone itself.

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rclone-aar
          path: rclone.aar
          retention-days: 14
